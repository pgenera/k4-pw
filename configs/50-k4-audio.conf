# Static PipeWire virtual audio nodes for Elecraft K4 RX and TX.
# Install:
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp configs/50-k4-audio.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Both nodes stay suspended at 0% CPU when idle, have low priority (100) so
# WirePlumber never selects them as default desktop mic/speakers, and remain
# immediately available when WSJT-X starts before k4-audio.socket wakes k4-audio.

context.objects = [
    {   factory = adapter
        args = {
            factory.name        = support.null-audio-sink
            node.name           = "k4_rx"
            node.description    = "Elecraft K4 RX"
            media.class         = "Audio/Source/Virtual"
            audio.position      = [ FL FR ]
            monitor.passthrough = true
            priority.driver     = 100
            priority.session    = 100
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "k4_tx"
            node.description = "Elecraft K4 TX"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            priority.driver  = 100
            priority.session = 100
        }
    }
]
